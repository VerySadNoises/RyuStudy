<!doctype html>
<html lang="en" data-theme="matcha">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F9F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chapitre">
<meta name="description" content="A quiet workspace for university writing.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
<link rel="icon" href="./assets/icon-192.png">
<link rel='stylesheet' href='./fonts.css'>
<link rel='stylesheet' href='./styles.css'>
<title>Chapitre · Study studio</title>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<aside id="sidebar">
  <a class="brand" href="#home"><img src="./assets/icon-192.png" alt="" width="46" height="46"><span>chapitre<small>STUDY STUDIO</small></span></a>
  <nav aria-label="Workspace" id="nav"></nav>
  <div class="sidebar-bottom" id="storage-indicator"></div>
</aside>
<div class="shell">
  <header id="topbar"></header>
  <aside class="banner" id="android-install" style="margin: 8px max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left))" hidden>
    <button type="button" class="button secondary" id="android-install-button">Install Chapitre</button>
  </aside>
  <p class="toast" id="android-install-status" role="status" hidden></p>
  <div id="error" role="alert" hidden></div>
  <main id="main" tabindex="-1"><p>Opening your workspace…</p></main>
  <footer class="footer">CHAPITRE <span>·</span> YOUR STUDY STUDIO</footer>
</div>
<div id="notice" class="toast" role="status" aria-live="polite" hidden></div>
<dialog id="dialog" aria-labelledby="dialog-title"></dialog>
<dialog id="confirm-dialog" aria-labelledby="confirm-title"></dialog>
<noscript>Enable JavaScript to open your local workspace.</noscript>
<script type="module" src="./js/install-android.js"></script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
